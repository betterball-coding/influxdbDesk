name: v1-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part release version from wails.json
        required: true
        default: 1.0.0
        type: string
  push:
    tags:
      - v1.0.0

permissions:
  contents: read

concurrency:
  group: v1-release-${{ inputs.version || '1.0.0' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_version="$(node -p "require('./wails.json').info.productVersion")"
          test "$source_version" = "$RELEASE_VERSION"

      - name: Frontend test and production build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run build

      - name: Backend and platform contract tests
        run: |
          go test ./...
          go vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -exec=/bin/true ./internal/...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go test -exec=/bin/true ./internal/...

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test backend on Windows
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows 10 x64 NSIS installer
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -clean -m -nsis -webview2 embed -o InfluxDesk.exe -nocolour -trimpath -s -skipbindings
          $exeVersion = (Get-Item .\build\bin\InfluxDesk.exe).VersionInfo.ProductVersion
          if ($exeVersion -ne $env:RELEASE_VERSION) {
            throw "Win10 executable version is $exeVersion, expected $($env:RELEASE_VERSION)."
          }
          $expected = ".\build\bin\InfluxDesk-$($env:RELEASE_VERSION)-win10-x64-installer.exe"
          if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
            throw "Win10 NSIS installer was not created: $expected"
          }
          New-Item -ItemType Directory -Force .\release\windows | Out-Null
          Copy-Item -LiteralPath $expected -Destination .\release\windows\

      - name: Build Windows 11 x64 executable and WiX MSI
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -clean -m -nopackage -webview2 error -o InfluxDesk.exe -nocolour -trimpath -s -skipbindings
          $exeVersion = (Get-Item .\build\bin\InfluxDesk.exe).VersionInfo.ProductVersion
          if ($exeVersion -ne $env:RELEASE_VERSION) {
            throw "Executable version is $exeVersion, expected $($env:RELEASE_VERSION)."
          }
          dotnet build .\build\windows\wix\InfluxDesk.wixproj `
            -c Release `
            -p:ProductVersion=$env:RELEASE_VERSION `
            -p:SourceDir="$pwd\build\bin"
          $msi = Get-ChildItem .\build\windows\wix\bin\Release -Filter *.msi -Recurse | Select-Object -First 1
          if ($null -eq $msi) { throw 'Win11 WiX build did not create an MSI.' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi.FullName, 0)
          $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductVersion'")
          $view.Execute()
          $record = $view.Fetch()
          $msiVersion = $record.StringData(1)
          if ($msiVersion -ne $env:RELEASE_VERSION) {
            throw "MSI version is $msiVersion, expected $($env:RELEASE_VERSION)."
          }
          Copy-Item -LiteralPath $msi.FullName -Destination ".\release\windows\InfluxDesk-$($env:RELEASE_VERSION)-win11-x64-installer.msi"

      - name: Record Windows artifact metadata
        shell: pwsh
        run: |
          $win10 = Get-Item ".\release\windows\InfluxDesk-$($env:RELEASE_VERSION)-win10-x64-installer.exe"
          $win11 = Get-Item ".\release\windows\InfluxDesk-$($env:RELEASE_VERSION)-win11-x64-installer.msi"
          $win10Signature = Get-AuthenticodeSignature -LiteralPath $win10.FullName
          $win11Signature = Get-AuthenticodeSignature -LiteralPath $win11.FullName
          @(
            'product=InfluxDesk'
            "version=$($env:RELEASE_VERSION)"
            'architecture=x86_64'
            'win10Package=NSIS EXE'
            'win10WebView2=embedded bootstrapper'
            "win10Signing=$($win10Signature.Status)"
            "win10Bytes=$($win10.Length)"
            'win11Package=WiX MSI'
            'win11WebView2=machine Evergreen Runtime required'
            "win11Signing=$($win11Signature.Status)"
            "win11Bytes=$($win11.Length)"
            'nativeRuntimeInstallTest=not run on GitHub hosted build runner'
          ) | Set-Content .\release\windows\BUILD_INFO_WINDOWS.txt -Encoding ascii
          Get-ChildItem .\release\windows\InfluxDesk-* | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content .\release\windows\SHA256SUMS_WINDOWS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: InfluxDesk-${{ inputs.version || '1.0.0' }}-windows-installers
          if-no-files-found: error
          path: release/windows/*

  macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build and verify universal macOS artifacts
        env:
          INFLUXDESK_MACOS_KEYCHAIN_TEST: '1'
        run: scripts/build-macos.sh universal

      - name: Verify release metadata
        run: |
          grep '^architectures=.*arm64' release/macos/BUILD_INFO.txt
          grep '^architectures=.*x86_64' release/macos/BUILD_INFO.txt
          grep '^signing=ad-hoc$' release/macos/BUILD_INFO.txt
          grep '^notarization=not submitted$' release/macos/BUILD_INFO.txt
          cd release/macos
          shasum -a 256 -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: InfluxDesk-${{ inputs.version || '1.0.0' }}-macos-universal
          if-no-files-found: error
          path: release/macos/*

  publish:
    needs:
      - windows
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: InfluxDesk-${{ inputs.version || '1.0.0' }}-windows-installers
          path: staging/windows

      - uses: actions/download-artifact@v4
        with:
          name: InfluxDesk-${{ inputs.version || '1.0.0' }}-macos-universal
          path: staging/macos

      - name: Assemble and verify release assets
        run: |
          mkdir -p release/v1
          cp staging/windows/InfluxDesk-* release/v1/
          cp staging/windows/BUILD_INFO_WINDOWS.txt release/v1/
          cp staging/macos/InfluxDesk-* release/v1/
          cp staging/macos/BUILD_INFO.txt release/v1/BUILD_INFO_MACOS.txt
          test -f "release/v1/InfluxDesk-$RELEASE_VERSION-win10-x64-installer.exe"
          test -f "release/v1/InfluxDesk-$RELEASE_VERSION-win11-x64-installer.msi"
          test -f "release/v1/InfluxDesk-$RELEASE_VERSION-macos-universal.zip"
          test -f "release/v1/InfluxDesk-$RELEASE_VERSION-macos-universal.dmg"
          cd release/v1
          sha256sum InfluxDesk-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create public GitHub release
        run: |
          test "$RELEASE_VERSION" = "1.0.0"
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "InfluxDesk v$RELEASE_VERSION" \
            --notes-file docs/releases/v1.0.0.md \
            --latest \
            release/v1/*

      - name: Verify published assets
        run: |
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url,assets
