name: macos-release

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-20260731
      - main
  pull_request:

permissions:
  contents: read

jobs:
  universal:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build and verify universal macOS artifacts
        env:
          INFLUXDESK_MACOS_KEYCHAIN_TEST: '1'
        run: scripts/build-macos.sh universal

      - name: Verify bundle architectures and metadata
        run: |
          lipo -archs build/bin/InfluxDesk.app/Contents/MacOS/InfluxDesk | grep arm64
          lipo -archs build/bin/InfluxDesk.app/Contents/MacOS/InfluxDesk | grep x86_64
          plutil -lint build/bin/InfluxDesk.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/bin/InfluxDesk.app
          cd release/macos
          shasum -a 256 -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: InfluxDesk-macos-universal-adhoc
          if-no-files-found: error
          path: |
            release/macos/*.zip
            release/macos/*.dmg
            release/macos/SHA256SUMS.txt
            release/macos/BUILD_INFO.txt
